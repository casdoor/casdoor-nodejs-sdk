name: main
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [^20]
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - run: yarn install
      - run: yarn lint

      - name: Start local Casdoor
        run: |
          docker run -d --name casdoor             -p 8000:8000             -e driverName=sqlite             -e dataSourceName='file:casdoor.db?cache=shared'             -e initDataFile=/init_data.json             -v "$PWD/.ci/casdoor/init_data.json:/init_data.json:ro"             casbin/casdoor-all-in-one

          for i in {1..60}; do
            if curl -fsS http://localhost:8000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs casdoor
          exit 1

      - run: yarn test

      - name: Dump Casdoor logs
        if: failure()
        run: docker logs casdoor

  semantic-release:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          cache: npm
          node-version: 20

      # Install yarn
      - run: npm install -g yarn

      - name: Run semantic-release
        if: github.repository == 'casdoor/casdoor-nodejs-sdk' && github.event_name == 'push'
        run: |
          yarn install
          yarn semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
